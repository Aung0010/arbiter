<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Arbiter | Multi-LLM Orchestration</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              /* ── Brand ── */
              primary:    {
                DEFAULT: 'var(--c-primary)',
                deep:    'var(--c-primary-deep)',
                press:   'var(--c-primary-press)',
                soft:    'var(--c-primary-soft)',
                subdued: 'var(--c-primary-bg-subdued-hover)',
                active:  'var(--c-primary-deep)',
              },
              brand: {
                dark: 'var(--c-brand-dark-900)',
              },
              /* ── Surface ── */
              canvas:     {
                DEFAULT: 'var(--c-canvas)',
                soft:    'var(--c-canvas-soft)',
                cream:   'var(--c-canvas-cream)',
              },
              surface:    { card: 'var(--c-surface-card)', strong: 'var(--c-surface-strong)' },
              /* ── Hairlines ── */
              hairline:   {
                DEFAULT: 'var(--c-hairline)',
                soft:    'var(--c-hairline-soft)',
                strong:  'var(--c-hairline-strong)',
                input:   'var(--c-hairline-input)',
              },
              /* ── Text ── */
              ink:        'var(--c-ink)',
              body:       { DEFAULT: 'var(--c-body)', strong: 'var(--c-body-strong)' },
              muted:      { DEFAULT: 'var(--c-muted)', soft: 'var(--c-muted-soft)' },
              'on-primary': 'var(--c-on-primary)',
              /* ── Timeline (AI-action pastels) ── */
              timeline:   {
                thinking: 'var(--c-timeline-thinking)',
                grep:     'var(--c-timeline-grep)',
                read:     'var(--c-timeline-read)',
                edit:     'var(--c-timeline-edit)',
                done:     'var(--c-timeline-done)',
              },
              /* ── Accent / Semantic ── */
              ruby:     'var(--c-ruby)',
              magenta:  'var(--c-magenta)',
              lemon:    'var(--c-lemon)',
              semantic: { success: 'var(--c-semantic-success)', error: 'var(--c-semantic-error)' },
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'monospace'],
            },
            borderRadius: {
              'xs':   '4px',
              'sm':   '6px',
              'md':   '8px',
              'lg':   '12px',
              'xl':   '16px',
              'pill': '9999px',
            },
            letterSpacing: {
              'display-mega': '-0.03em',
              'display-lg':   '-0.02em',
              'display-md':   '-0.0125em',
              'display-sm':   '-0.005em',
              'upper':        '0.055em',
            },
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

      /* ── Light Mode Tokens ── */
      :root {
        /* Brand — Purple */
        --c-primary:                    #533afd;
        --c-primary-deep:               #4434d4;
        --c-primary-press:              #2e2b8c;
        --c-primary-soft:               #665efd;
        --c-primary-bg-subdued-hover:   #b9b9f9;
        --c-brand-dark-900:             #1c1e54;
        --c-primary-active:             #4434d4;

        /* Surface — Cool white */
        --c-canvas:                     #ffffff;
        --c-canvas-soft:                #f6f9fc;
        --c-canvas-cream:               #f5e9d4;
        --c-surface-card:               #ffffff;
        --c-surface-strong:             #eef2f7;

        /* Hairlines — Cool blue-gray */
        --c-hairline:                   #e3e8ee;
        --c-hairline-soft:              #eef2f7;
        --c-hairline-strong:            #c8d3de;
        --c-hairline-input:             #a8c3de;

        /* Text — Deep navy */
        --c-ink:                        #0d253d;
        --c-body:                       #273951;
        --c-body-strong:                #0d253d;
        --c-muted:                      #64748d;
        --c-muted-soft:                 #8fa3be;
        --c-on-primary:                 #ffffff;

        /* Timeline pastels — AI-action signature (purple-brand palette) */
        --c-timeline-thinking:          #f5e9d4;  /* canvas-cream peach */
        --c-timeline-grep:              #b9b9f9;  /* primary-bg-subdued-hover lavender */
        --c-timeline-read:              #9fbbe0;  /* cool sky blue */
        --c-timeline-edit:              #f3c6ee;  /* soft magenta tint */
        --c-timeline-done:              #d4b483;  /* warm gold / lemon-light */

        /* Accents */
        --c-ruby:                       #ea2261;
        --c-magenta:                    #f96bee;
        --c-lemon:                      #9b6829;

        /* Semantic */
        --c-semantic-success:           #1a7a50;
        --c-semantic-error:             #ea2261;  /* ruby */
      }

      /* ── Dark Mode Tokens (deep navy dark) ── */
      html.dark {
        /* Brand stays purple */
        --c-primary:                    #665efd;
        --c-primary-deep:               #533afd;
        --c-primary-press:              #4434d4;
        --c-primary-soft:               #7b74fd;
        --c-primary-bg-subdued-hover:   #2e2b8c;
        --c-brand-dark-900:             #1c1e54;
        --c-primary-active:             #533afd;

        /* Surface — deep navy */
        --c-canvas:                     #0d1929;
        --c-canvas-soft:                #111e30;
        --c-canvas-cream:               #1e1a0f;
        --c-surface-card:               #162035;
        --c-surface-strong:             #1d2840;

        /* Hairlines — dark navy dividers */
        --c-hairline:                   #1e2e44;
        --c-hairline-soft:              #172539;
        --c-hairline-strong:            #2a3d56;
        --c-hairline-input:             #2a4060;

        /* Text — light on dark navy */
        --c-ink:                        #e8eef6;
        --c-body:                       #9bb3cc;
        --c-body-strong:                #e8eef6;
        --c-muted:                      #5d7a99;
        --c-muted-soft:                 #3a506a;
        --c-on-primary:                 #ffffff;

        /* Timeline pastels — muted for dark */
        --c-timeline-thinking:          #3a2e1a;
        --c-timeline-grep:              #2e2b8c;
        --c-timeline-read:              #1a3050;
        --c-timeline-edit:              #3a1a38;
        --c-timeline-done:              #3a2e10;

        /* Accents */
        --c-ruby:                       #f04d7f;
        --c-magenta:                    #fa88f2;
        --c-lemon:                      #c49040;

        /* Semantic */
        --c-semantic-success:           #2aaf80;
        --c-semantic-error:             #f04d7f;
      }

      /* ── Base ── */
      *, *::before, *::after { box-sizing: border-box; }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 16px;
        font-weight: 400;
        line-height: 1.5;
        background-color: var(--c-canvas);
        color: var(--c-body);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      code, pre, .font-mono {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 13px;
      }

      /* ── Prevent iOS auto-zoom on textarea/input focus ── */
      input, textarea, select {
        font-size: 16px !important;
      }

      /* ── iOS momentum scrolling ── */
      .overflow-y-auto {
        -webkit-overflow-scrolling: touch;
      }

      /* ── Custom scrollbar ── */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: var(--c-hairline-strong);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--c-muted); }

      /* ── Prose overrides (react-markdown) ── */
      .prose { color: var(--c-body); }
      .prose strong { color: var(--c-ink); font-weight: 600; }
      .prose h1, .prose h2, .prose h3, .prose h4 { color: var(--c-ink); font-weight: 400; letter-spacing: -0.01em; }
      .prose code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        background: var(--c-surface-strong);
        color: var(--c-ink);
        padding: 1px 5px;
        border-radius: 4px;
      }
      .prose pre {
        background: var(--c-surface-card);
        border: 1px solid var(--c-hairline);
        border-radius: 8px;
        padding: 16px 20px;
      }
      .prose pre code { background: transparent; padding: 0; }
      .prose a { color: var(--c-primary); }
      .prose blockquote { border-left-color: var(--c-hairline-strong); color: var(--c-muted); }
      .prose hr { border-color: var(--c-hairline); }

      /* ── Animation ── */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up { animation: fadeInUp 0.2s ease-out forwards; }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .animate-spin { animation: spin 0.75s linear infinite; }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .animate-pulse { animation: pulse 1.4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

      @keyframes typing-dot {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
        30% { transform: translateY(-5px); opacity: 1; }
      }
      .animate-typing-dot { animation: typing-dot 1.2s ease-in-out infinite; }
    </style>

    <!-- Initialize theme immediately to prevent flash -->
    <script>
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react-markdown": "https://esm.sh/react-markdown@^9.0.1",
    "uuid": "https://esm.sh/uuid@^13.0.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>

</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
