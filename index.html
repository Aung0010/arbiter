<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arbiter | Multi-LLM Orchestration</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              /* ── Brand ── */
              primary:    { DEFAULT: 'var(--c-primary)',        active: 'var(--c-primary-active)' },
              /* ── Surface ── */
              canvas:     { DEFAULT: 'var(--c-canvas)',         soft: 'var(--c-canvas-soft)' },
              surface:    { card: 'var(--c-surface-card)',      strong: 'var(--c-surface-strong)' },
              /* ── Hairlines ── */
              hairline:   { DEFAULT: 'var(--c-hairline)',       soft: 'var(--c-hairline-soft)', strong: 'var(--c-hairline-strong)' },
              /* ── Text ── */
              ink:        'var(--c-ink)',
              body:       { DEFAULT: 'var(--c-body)',           strong: 'var(--c-body-strong)' },
              muted:      { DEFAULT: 'var(--c-muted)',          soft: 'var(--c-muted-soft)' },
              'on-primary': 'var(--c-on-primary)',
              /* ── Timeline (AI-action pastels) ── */
              timeline:   {
                thinking: 'var(--c-timeline-thinking)',
                grep:     'var(--c-timeline-grep)',
                read:     'var(--c-timeline-read)',
                edit:     'var(--c-timeline-edit)',
                done:     'var(--c-timeline-done)',
              },
              /* ── Semantic ── */
              semantic:   { success: 'var(--c-semantic-success)', error: 'var(--c-semantic-error)' },
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'monospace'],
            },
            borderRadius: {
              'xs':   '4px',
              'sm':   '6px',
              'md':   '8px',
              'lg':   '12px',
              'xl':   '16px',
              'pill': '9999px',
            },
            letterSpacing: {
              'display-mega': '-0.03em',
              'display-lg':   '-0.02em',
              'display-md':   '-0.0125em',
              'display-sm':   '-0.005em',
              'upper':        '0.055em',
            },
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

      /* ── Light Mode Tokens ── */
      :root {
        /* Brand */
        --c-primary:              #f54e00;
        --c-primary-active:       #d04200;

        /* Surface */
        --c-canvas:               #f7f7f4;
        --c-canvas-soft:          #fafaf7;
        --c-surface-card:         #ffffff;
        --c-surface-strong:       #e6e5e0;

        /* Hairlines */
        --c-hairline:             #e6e5e0;
        --c-hairline-soft:        #efeee8;
        --c-hairline-strong:      #cfcdc4;

        /* Text */
        --c-ink:                  #26251e;
        --c-body:                 #5a5852;
        --c-body-strong:          #26251e;
        --c-muted:                #807d72;
        --c-muted-soft:           #a09c92;
        --c-on-primary:           #ffffff;

        /* Timeline pastels — AI-action signature */
        --c-timeline-thinking:    #dfa88f;
        --c-timeline-grep:        #9fc9a2;
        --c-timeline-read:        #9fbbe0;
        --c-timeline-edit:        #c0a8dd;
        --c-timeline-done:        #c08532;

        /* Semantic */
        --c-semantic-success:     #1f8a65;
        --c-semantic-error:       #cf2d56;
      }

      /* ── Dark Mode Tokens (warm dark) ── */
      html.dark {
        /* Brand stays the same */
        --c-primary:              #f54e00;
        --c-primary-active:       #d04200;

        /* Surface → warm dark */
        --c-canvas:               #1a1916;
        --c-canvas-soft:          #1f1e1b;
        --c-surface-card:         #222119;
        --c-surface-strong:       #2e2d27;

        /* Hairlines → warm dark */
        --c-hairline:             #2e2d27;
        --c-hairline-soft:        #282720;
        --c-hairline-strong:      #3a3932;

        /* Text → warm inverted */
        --c-ink:                  #f0efe8;
        --c-body:                 #a09c92;
        --c-body-strong:          #f0efe8;
        --c-muted:                #6e6b61;
        --c-muted-soft:           #4f4d46;
        --c-on-primary:           #ffffff;

        /* Timeline pastels are slightly muted in dark mode */
        --c-timeline-thinking:    #c49278;
        --c-timeline-grep:        #85ac88;
        --c-timeline-read:        #85a3c8;
        --c-timeline-edit:        #a490c4;
        --c-timeline-done:        #a87228;

        /* Semantic */
        --c-semantic-success:     #2aaf80;
        --c-semantic-error:       #e5476a;
      }

      /* ── Base ── */
      *, *::before, *::after { box-sizing: border-box; }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 16px;
        font-weight: 400;
        line-height: 1.5;
        background-color: var(--c-canvas);
        color: var(--c-body);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      code, pre, .font-mono {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 13px;
      }

      /* ── Custom scrollbar ── */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: var(--c-hairline-strong);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--c-muted); }

      /* ── Prose overrides (react-markdown) ── */
      .prose { color: var(--c-body); }
      .prose strong { color: var(--c-ink); font-weight: 600; }
      .prose h1, .prose h2, .prose h3, .prose h4 { color: var(--c-ink); font-weight: 400; letter-spacing: -0.01em; }
      .prose code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        background: var(--c-surface-strong);
        color: var(--c-ink);
        padding: 1px 5px;
        border-radius: 4px;
      }
      .prose pre {
        background: var(--c-surface-card);
        border: 1px solid var(--c-hairline);
        border-radius: 8px;
        padding: 16px 20px;
      }
      .prose pre code { background: transparent; padding: 0; }
      .prose a { color: var(--c-primary); }
      .prose blockquote { border-left-color: var(--c-hairline-strong); color: var(--c-muted); }
      .prose hr { border-color: var(--c-hairline); }

      /* ── Animation ── */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up { animation: fadeInUp 0.2s ease-out forwards; }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .animate-spin { animation: spin 0.75s linear infinite; }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .animate-pulse { animation: pulse 1.4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>

    <!-- Initialize theme immediately to prevent flash -->
    <script>
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react-markdown": "https://esm.sh/react-markdown@^9.0.1",
    "uuid": "https://esm.sh/uuid@^13.0.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
